<link rel="manifest" href="manifest.json">

<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#1c16c5">
<script>
  // Settes før rendering så siden ikke blinker hvitt
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('lunsj-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.dataset.theme = 'dark';
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div class="lang-group">

    <button type="button" class="btn btn-ghost btn-sm" data-lang="en">ENG</button>
  </div>
  <button type="button" class="btn btn-ghost btn-sm btn-icon-only" id="themeToggle">

  <div class="friday-banner" id="fridayBanner" hidden>

    <span id="fridayLine"></span>
    <span class="friday-coffee" id="fridayCoffee" hidden></span>
  </div>

  <header class="page-head">
    <div class="datestamp" id="datestamp"></div>
    <p class="lede" data-t="sub"></p>
  </header>

  <div class="day-row">
    <div class="day-group" id="weekTabs"></div>
  </div>

  <div class="section-row">
    <button type="button" class="btn btn-ghost btn-sm" data-section="lunch" data-t="lunch"></button>
    <button type="button" class="btn btn-ghost btn-sm" data-section="dinner" data-t="dinner"></button>
    <span class="spacer"></span>

    </button>
  </div>

  <div class="copy-fallback" id="copyFallback" hidden>
    <div class="copy-fallback-head">
      <span data-t="copyManual"></span>
      <button type="button" class="btn btn-ghost btn-xs" id="closeFallback" data-t="close"></button>
    </div>
    <textarea class="input" rows="10" readonly id="copyFallbackText"></textarea>
  </div>

  <div class="card elev-sm weekend-card" id="weekendCard" hidden>
    <div class="card-kicker" data-t="weekendKicker"></div>
    <div class="card-title" data-t="weekendTitle"></div>
    <p class="card-body" data-t="weekendBody"></p>
    <button type="button" class="btn btn-primary" id="weekendCta" data-t="weekendCta"></button>
  </div>

  <section id="lunchSection">
    <div class="card-grid" id="canteenCards"></div>
    <div class="card elev-sm bakery" id="bakeryCard"></div>
  </section>

  <section id="dinnerSection" hidden>
    <div class="dinner-wrap" id="dinnerCard"></div>
  </section>

  <div class="card elev-sm map-card">
    <div class="map-head">
      <div class="map-head-text">
        <div class="card-kicker" data-t="mapTitle"></div>
        <p class="card-body" data-t="mapSub"></p>
      </div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
    <div class="map" id="map">
      <div class="map-inner" id="mapInner"></div>
      <div class="map-zoom">
        <button type="button" class="zoom-btn" id="mapZoomIn" aria-label="Zoom inn">+</button>
        <button type="button" class="zoom-btn" id="mapZoomOut" aria-label="Zoom ut">−</button>
        <button type="button" class="zoom-btn" id="mapZoomReset" aria-label="Nullstill zoom">
          <svg viewBox="0 0 24 24" class="ico-14"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>

    </div>

  <div class="footer-links">
    <a href="https://iss.kantinebetaling.no/" target="_blank" rel="noopener" class="btn btn-secondary btn-sm icon-btn">
      <svg viewBox="0 0 24 24" class="ico-14"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
      <span data-t="topUpCard"></span>
    </a>
    <a href="https://widget.inisign.com/Widget/Customers/Customer.aspx?token=c5a641de-e74e-48eb-be4e-d847f261ec11"

      <span data-t="issOriginal"></span>

    <button type="button" class="btn btn-ghost btn-sm icon-btn install-btn" id="installBtn" hidden>

      <svg viewBox="0 0 24 24" class="ico-14"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span data-t="oldSite"></span>

    <button type="button" class="btn btn-ghost btn-sm icon-btn" id="aboutBtn">
      <svg viewBox="0 0 24 24" class="ico-14"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg>
      <span data-t="aboutBtn"></span>
    </button>
  </div>

  <p class="footnote" data-t="footerNote"></p>
