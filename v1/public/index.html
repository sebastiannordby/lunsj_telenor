<meta name="theme-color" content="#1c16c5">
<script>
  // Settes før rendering så siden ikke blinker hvitt
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('lunsj-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.dataset.theme = 'dark';
    // Sesongpynt settes av serveren; brukeren kan ha skrudd den av
    var root = document.documentElement, season = root.dataset.season;
    if (season) {
      root.dataset.seasonAvail = season;
      try { if (localStorage.getItem('lunsj-season') === 'off') delete root.dataset.season; } catch (e) {}
    }
  })();
</script>
